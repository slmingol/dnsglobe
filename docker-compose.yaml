services:
  dnsglobe:
    # Pull from GHCR (no local build needed):
    #   image: ghcr.io/slmingol/dnsglobe:latest
    # Build locally:
    build: .
    image: ghcr.io/slmingol/dnsglobe:latest
    stdin_open: true
    tty: true
    # Usage: docker compose run --rm dnsglobe example.com [flags]

  dnsglobe-web:
    build: .
    image: ghcr.io/slmingol/dnsglobe:latest
    entrypoint: ["/usr/local/bin/dnsglobe-web"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    # Usage: docker compose up dnsglobe-web
    #        open http://localhost:8080
