services:
  dnsglobe:
    image: ghcr.io/slmingol/dnsglobe:edge
    pull_policy: always
    stdin_open: true
    tty: true
    # Usage: docker compose run --rm dnsglobe example.com [flags]
    # To build locally: docker compose build

  dnsglobe-web:
    image: ghcr.io/slmingol/dnsglobe:edge
    pull_policy: always
    entrypoint: ["/usr/local/bin/dnsglobe-web"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    # Usage: docker compose up dnsglobe-web
    #        open http://localhost:8080
