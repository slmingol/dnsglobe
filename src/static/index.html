<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Globe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --ok: #3fb950;
    --differs: #d2a8ff;
    --error: #f85149;
    --pending: #d29922;
    --accent: #58a6ff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    gap: 8px;
    flex: 1;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font: inherit;
    flex: 1;
    min-width: 160px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  .ecs-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ecs-label {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .ecs-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font: inherit;
    width: 160px;
    outline: none;
  }
  .ecs-input:focus { border-color: var(--accent); }

  .btn-row {
    display: flex;
    gap: 6px;
  }

  button {
    background: var(--accent);
    border: none;
    color: #0d1117;
    padding: 6px 16px;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.watch-active {
    background: var(--pending);
  }
  button.secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }

  .tabs {
    padding: 0 24px;
    display: flex;
    gap: 2px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    padding: 7px 14px;
    cursor: pointer;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    margin-bottom: -1px;
    transition: color 0.1s;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); opacity: 1; }
  .tab:disabled { opacity: 1; }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .progress-wrap {
    height: 3px;
    background: var(--surface);
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }

  .status-line {
    padding: 6px 24px;
    color: var(--muted);
    font-size: 12px;
    min-height: 24px;
  }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .table-panel {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--surface); }

  td {
    padding: 7px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }

  .status-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .s-ok      { color: var(--ok);      background: #1a3a22; }
  .s-differs { color: var(--differs); background: #2d1f45; }
  .s-error,
  .s-servfail { color: var(--error);  background: #3d1218; }
  .s-nxdomain { color: var(--muted);  background: #1c2028; }
  .s-pending  { color: var(--pending); background: #2d2208; }

  .ping { color: var(--muted); }
  .ping.fast { color: var(--ok); }
  .ping.slow { color: var(--error); }

  .globe-panel {
    width: 380px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .globe-panel svg {
    width: 100%;
    height: auto;
  }

  .globe-label {
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
    text-align: center;
  }

  footer {
    padding: 8px 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    display: flex;
    gap: 12px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 900px) {
    .globe-panel { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>&#127757; DNS Globe</h1>
  <div class="controls">
    <input type="text" id="domain" placeholder="example.com">
    <div class="ecs-wrap">
      <span class="ecs-label">ECS</span>
      <input type="text" id="ecs" class="ecs-input" placeholder="203.0.113.0/24">
    </div>
    <div class="btn-row">
      <button id="check-btn" onclick="startCheck()">Check</button>
      <button id="watch-btn" class="secondary" onclick="toggleWatch()">Watch</button>
    </div>
  </div>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" onclick="setTab(this,'A')">A</button>
  <button class="tab" onclick="setTab(this,'AAAA')">AAAA</button>
  <button class="tab" onclick="setTab(this,'CNAME')">CNAME</button>
  <button class="tab" onclick="setTab(this,'MX')">MX</button>
  <button class="tab" onclick="setTab(this,'NS')">NS</button>
  <button class="tab" onclick="setTab(this,'TXT')">TXT</button>
  <button class="tab" onclick="setTab(this,'SOA')">SOA</button>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
<div class="status-line" id="status-line">Enter a domain and click Check.</div>

<main>
  <div class="table-panel">
    <table>
      <thead>
        <tr>
          <th>Resolver</th>
          <th>Loc</th>
          <th>IP</th>
          <th>Ping</th>
          <th>Status</th>
          <th>Answer</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="globe-panel">
    <svg id="globe-svg" viewBox="0 0 340 340"></svg>
    <div class="globe-label">Resolver globe &mdash; dots colored by status</div>
  </div>
</main>

<footer>
  <span>dnsglobe v{{VERSION}}</span>
  <span>&middot;</span>
  <a href="https://github.com/514-labs/dnsglobe" target="_blank" rel="noopener">github.com/514-labs/dnsglobe</a>
</footer>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let resolverMap = {};
let ws = null;
let animFrame = null;
let rotation = 0;
let total = 0;
let done = 0;
let worldData = null;
let landFeatures = null;
let activeRtype = 'A';

// Watch mode
let watchMode = false;
let watchTimer = null;
let watchCountdown = 0;

// ── Globe setup ────────────────────────────────────────────────────────────
const svgEl = document.getElementById('globe-svg');
const W = 340, H = 340, R = 155;
const projection = d3.geoOrthographic()
  .scale(R)
  .translate([W / 2, H / 2])
  .clipAngle(90);
const path = d3.geoPath().projection(projection);
const svg = d3.select('#globe-svg');

svg.append('circle')
  .attr('cx', W / 2).attr('cy', H / 2).attr('r', R)
  .attr('fill', '#1a2030');

const landGroup = svg.append('g').attr('class', 'land');
const dotGroup  = svg.append('g').attr('class', 'dots');

svg.append('circle')
  .attr('cx', W / 2).attr('cy', H / 2).attr('r', R)
  .attr('fill', 'none').attr('stroke', '#30363d').attr('stroke-width', 1);

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(data => {
    worldData = data;
    landFeatures = topojson.feature(data, data.objects.countries).features;
    landGroup.selectAll('path')
      .data(landFeatures)
      .join('path')
      .attr('fill', '#2a3a50')
      .attr('stroke', '#3a4a60')
      .attr('stroke-width', 0.4);
    animate();
  })
  .catch(() => { animate(); });

function statusColor(status) {
  switch (status) {
    case 'ok':       return '#3fb950';
    case 'differs':  return '#d2a8ff';
    case 'error':
    case 'servfail': return '#f85149';
    case 'nxdomain': return '#8b949e';
    default:         return '#d29922';
  }
}

function redrawDots() {
  const dots = Object.values(resolverMap).filter(r => r.lat != null && r.lon != null);
  const sel = dotGroup.selectAll('circle').data(dots, d => d.index);
  sel.join(
    enter => enter.append('circle').attr('r', 4).attr('opacity', 0.85),
    update => update,
    exit => exit.remove()
  )
  .attr('fill', d => statusColor(d.status))
  .attr('stroke', '#0d1117')
  .attr('stroke-width', 1)
  .attr('transform', d => {
    const proj = projection([d.lon, d.lat]);
    return proj ? `translate(${proj[0]},${proj[1]})` : 'translate(-999,-999)';
  });
}

function redrawLand() {
  if (!landFeatures) return;
  landGroup.selectAll('path').attr('d', path);
}

function animate() {
  rotation += 0.2;
  projection.rotate([rotation, -20]);
  redrawLand();
  redrawDots();
  animFrame = requestAnimationFrame(animate);
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function setTab(el, rtype) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  activeRtype = rtype;
  updateUrl();
}

// ── Table ──────────────────────────────────────────────────────────────────
function pingClass(ms) {
  if (ms == null) return 'ping';
  if (ms < 80) return 'ping fast';
  if (ms > 300) return 'ping slow';
  return 'ping';
}

function renderRow(r) {
  const tr = document.getElementById('row-' + r.index) || (() => {
    const el = document.createElement('tr');
    el.id = 'row-' + r.index;
    document.getElementById('tbody').appendChild(el);
    return el;
  })();

  const pingStr = r.ping_ms != null ? r.ping_ms + 'ms' : '…';
  const answerStr = (r.answer || []).join(', ') || '—';
  const ttlStr = r.ttl != null ? ` ttl=${r.ttl}` : '';

  tr.innerHTML = `
    <td title="${r.resolver}">${r.resolver}</td>
    <td>${r.location}</td>
    <td>${r.ip}</td>
    <td class="${pingClass(r.ping_ms)}">${pingStr}</td>
    <td><span class="status-badge s-${r.status}">${r.status.toUpperCase()}</span></td>
    <td title="${answerStr}${ttlStr}">${answerStr}</td>
  `;
}

// ── Share URL ──────────────────────────────────────────────────────────────
function updateUrl() {
  const domain = document.getElementById('domain').value.trim();
  const ecs = document.getElementById('ecs').value.trim();
  const params = new URLSearchParams();
  if (domain) params.set('domain', domain);
  if (activeRtype && activeRtype !== 'A') params.set('type', activeRtype);
  if (ecs) params.set('ecs', ecs);
  const qs = params.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}

// ── Watch mode ─────────────────────────────────────────────────────────────
function toggleWatch() {
  watchMode = !watchMode;
  const btn = document.getElementById('watch-btn');
  if (watchMode) {
    btn.textContent = 'Stop';
    btn.classList.remove('secondary');
    btn.classList.add('watch-active');
  } else {
    btn.textContent = 'Watch';
    btn.classList.add('secondary');
    btn.classList.remove('watch-active');
    clearWatchTimer();
  }
}

function clearWatchTimer() {
  if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
  watchCountdown = 0;
}

function scheduleRepoll(domain, rtype) {
  if (!watchMode) return;
  clearWatchTimer();
  watchCountdown = 30;
  watchTimer = setInterval(() => {
    watchCountdown--;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    document.getElementById('status-line').textContent =
      `${pct}% propagated (${done}/${total}) — next poll in ${watchCountdown}s`;
    if (watchCountdown <= 0) {
      clearWatchTimer();
      startCheck();
    }
  }, 1000);
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function startCheck() {
  const domain = document.getElementById('domain').value.trim();
  if (!domain) { alert('Enter a domain first.'); return; }
  const ecs = document.getElementById('ecs').value.trim();

  clearWatchTimer();
  if (ws) { ws.close(); ws = null; }

  resolverMap = {};
  done = 0;
  total = 0;
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('status-line').textContent = `Querying ${domain} ${activeRtype}${ecs ? ' ecs=' + ecs : ''}…`;
  document.getElementById('check-btn').disabled = true;

  updateUrl();

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let url = `${proto}://${location.host}/ws?domain=${encodeURIComponent(domain)}&type=${activeRtype}`;
  if (ecs) url += `&ecs=${encodeURIComponent(ecs)}`;
  ws = new WebSocket(url);

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);

    if (msg.done) {
      const pct = total > 0 ? Math.round(done / total * 100) : 0;
      document.getElementById('status-line').textContent =
        `Done — ${pct}% propagated (${done}/${total}) for ${domain} ${activeRtype}`;
      document.getElementById('check-btn').disabled = false;
      document.getElementById('progress').style.width = '100%';
      ws.close();
      scheduleRepoll(domain, activeRtype);
      return;
    }

    if (msg.error) {
      document.getElementById('status-line').textContent = 'Error: ' + msg.error;
      document.getElementById('check-btn').disabled = false;
      return;
    }

    if (msg.total > 0) total = msg.total;

    resolverMap[msg.index] = msg;
    renderRow(msg);

    if (msg.status !== 'pending') {
      done++;
      const pct = total > 0 ? Math.round(done / total * 100) : 0;
      document.getElementById('progress').style.width = pct + '%';
      document.getElementById('status-line').textContent =
        `${done}/${total} responded — ${domain} ${activeRtype}`;
    }
  };

  ws.onerror = () => {
    document.getElementById('status-line').textContent = 'WebSocket error.';
    document.getElementById('check-btn').disabled = false;
  };

  ws.onclose = () => {
    document.getElementById('check-btn').disabled = false;
  };
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.getElementById('domain').addEventListener('keydown', e => {
  if (e.key === 'Enter') startCheck();
});
document.getElementById('ecs').addEventListener('keydown', e => {
  if (e.key === 'Enter') startCheck();
});

// ── Load from URL params ───────────────────────────────────────────────────
(function () {
  const params = new URLSearchParams(location.search);
  const domain = params.get('domain');
  const type   = params.get('type');
  const ecs    = params.get('ecs');

  if (domain) document.getElementById('domain').value = domain;
  if (ecs)    document.getElementById('ecs').value = ecs;
  if (type) {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.textContent === type);
    });
    activeRtype = type;
  }
  if (domain) startCheck();
})();
</script>
</body>
</html>
