name: Web UI Screenshot

on:
  push:
    branches: [development]
    paths:
      - src/static/index.html
      - src/bin/web.rs
      - scripts/screenshot.js
      - .github/workflows/screenshot.yml
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Start dnsglobe-web
        run: |
          docker pull ghcr.io/slmingol/dnsglobe:edge
          docker run -d --name dnsglobe-web -p 8080:8080 \
            ghcr.io/slmingol/dnsglobe:edge \
            /usr/local/bin/dnsglobe-web
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080 > /dev/null || { docker logs dnsglobe-web; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Capture screenshot
        run: node scripts/screenshot.js

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo/web-ui.png demo/web-ui-shortcuts.png
          git diff --staged --quiet && echo "no change" || \
            (git commit -m "chore: update web UI screenshots [skip ci]" && \
             git push origin development)
